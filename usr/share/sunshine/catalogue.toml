# The Sunshine OS app catalogue: ONE list for the installer (checkboxes, groups), the store and the first update.
# Each [[app]]:
#   id          short name; the meta-package is sunshine-app-<id>
#   name, desc  what the user sees
#   group       System | Development | Internet | Media and games | Notes and AI | Everyday
#   pacman      packages from the official repos (installed with the system)
#   aur         packages from the AUR (installed by the AUR helper at the first online update; we do not host third-party binaries)
#   webapp      { url, name } a web service wrapped as an app window (needs a browser; Chromium-based browsers open it as an app)
#   setup       a Sunshine setup script that finishes the job (runs after the packages)
#   first_update  true: offered/installed on the very first update
#   selected    true: ticked by default in the installer
# Needs [multilib] in pacman.conf: steam, wine, lib32 packages.

# ------------------------------------------------------------------ Everyday
[[app]]
id = "firefox"
name = "Firefox"
group = "Everyday"
desc = "The default web browser"
pacman = ["firefox"]
selected = true
[[app]]
id = "zen"
name = "Zen Browser"
group = "Everyday"
desc = "A Firefox-based browser focused on calm and privacy"
aur = ["zen-browser-bin"]
first_update = true
[[app]]
id = "okular"
name = "Okular"
group = "Everyday"
desc = "PDF and Markdown reader (the default for both)"
pacman = ["okular"]
selected = true
[[app]]
id = "libreoffice"
name = "LibreOffice"
group = "Everyday"
desc = "Documents, spreadsheets, presentations"
pacman = ["libreoffice-fresh"]
first_update = true
[[app]]
id = "gwenview"
name = "Gwenview"
group = "Everyday"
desc = "Image and video viewer (set as the default for pictures and videos)"
pacman = ["gwenview"]
setup = "default-viewer"
selected = true
[[app]]
id = "vlc"
name = "VLC"
group = "Media and games"
desc = "Plays almost any media"
pacman = ["vlc"]
[[app]]
id = "mpv"
name = "mpv"
group = "Media and games"
desc = "Light, fast video player"
pacman = ["mpv"]

